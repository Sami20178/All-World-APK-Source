name: Build All-World-icon-fixed-install.apk

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Gradle 8.9
        shell: bash
        run: |
          set -euo pipefail
          GRADLE_VERSION=8.9
          curl --fail --silent --show-error --location \
            "https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip" \
            --output "$RUNNER_TEMP/gradle.zip"
          unzip -q "$RUNNER_TEMP/gradle.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/gradle-${GRADLE_VERSION}/bin" >> "$GITHUB_PATH"
          gradle --version

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"

      - name: Install Android SDK components
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Build APK
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Verify APK structure, signature and metadata
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          unzip -t "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | tee apk-badging.txt
          grep -q "package: name='com.allworld.app'" apk-badging.txt
          grep -q "sdkVersion:'28'" apk-badging.txt

      - name: Name the requested APK
        run: cp app/build/outputs/apk/debug/app-debug.apk All-World-icon-fixed-install.apk

      - name: Upload only the requested APK
        uses: actions/upload-artifact@v4
        with:
          name: All-World-icon-fixed-install
          path: All-World-icon-fixed-install.apk
          if-no-files-found: error
          retention-days: 30
