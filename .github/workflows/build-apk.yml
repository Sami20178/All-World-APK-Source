name: Build All-World-icon-fixed-install.apk

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Build APK
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Verify APK structure and metadata
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          unzip -t "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | tee apk-badging.txt
          grep -q "package: name='com.allworld.app'" apk-badging.txt
          grep -q "sdkVersion:'28'" apk-badging.txt

      - name: Name the requested APK
        run: cp app/build/outputs/apk/debug/app-debug.apk All-World-icon-fixed-install.apk

      - name: Upload only the requested APK
        uses: actions/upload-artifact@v4
        with:
          name: All-World-icon-fixed-install
          path: All-World-icon-fixed-install.apk
          if-no-files-found: error
          retention-days: 30
